(function(){

var SCHED=[{"A":[1,6,0],"B":[2,5,3]},{"A":[4,5,1],"B":[0,3,2]},{"A":[0,1,6],"B":[2,4,5]},{"A":[3,6,2],"B":[1,5,4]},{"A":[0,2,3],"B":[4,6,5]},{"A":[2,3,1],"B":[0,4,6]},{"A":[5,6,0],"B":[1,3,4]},{"A":[0,5,1],"B":[2,6,3]},{"A":[1,2,0],"B":[3,4,5]},{"A":[3,5,4],"B":[0,6,2]},{"A":[1,4,6]}];
var START=13*60, SLOT=25;
function hm(m){return Math.floor(m/60)+':'+String(m%60).padStart(2,'0')}
var T_AGG=START+SCHED.length*SLOT, T_SF=T_AGG+10, T_FIN=T_SF+SLOT, T_END=T_FIN+SLOT;

function ss(k,v){try{if(v===undefined)return sessionStorage.getItem(k);if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v);}catch(e){return null}}

var f0=ls('jk-filter'); if(f0!==null&&f0!=='') filter=+f0;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function sc(key){var v=state.scores[key];return (v&&typeof v[0]==='number'&&typeof v[1]==='number')?v:null}
function name(i){return state.teams[i]||('チーム'+(i+1))}
// 長いチーム名の改行位置（ここに足せば他のチームも調整できます）
var SPLIT={'ハッピージャンプ':['ハッピー','ジャンプ']};
function nameHTML(i){var n=name(i);return SPLIT[n]?SPLIT[n].map(esc).join('<wbr>'):esc(n)}
function nameLines(n){return SPLIT[n]||[n]}
var CIRC=['①','②','③','④','⑤','⑥','⑦','⑧'];
function fmt(ts){if(!ts)return '';var d=new Date(ts);if(isNaN(d))return String(ts);return (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}

function rpc(fn,args){var a={p_id:cred&&cred.id,p_pw:cred&&cred.pw};for(var k in args)a[k]=args[k];return sb.rpc(fn,a);}

function compute(){
  var n=state.teams.length, st=[];
  for(var i=0;i<n;i++) st.push({i:i,w:0,l:0,pf:0,pa:0,p:0});
  var played=0,total=0,h2h={};
  SCHED.forEach(function(s,k){['A','B'].forEach(function(c){ if(!s[c])return; total++;

    [0,1].forEach(function(i){var t=i?m.b:m.a,val=i?vb:va;
      h+='<div class="ent"><span class="tn">'+esc(name(t))+'</span><div class="step"><button type="button" data-step="'+i+'" data-d="-1" aria-label="'+esc(name(t))+'の点を1点減らす">−</button><input type="number" inputmode="numeric" min="0" max="99" id="score-'+i+'" value="'+esc(val)+'" aria-label="'+esc(name(t))+'の得点"><button type="button" data-step="'+i+'" data-d="1" aria-label="'+esc(name(t))+'の点を1点増やす">＋</button></div></div>';});
    h+='<p class="note">審判（主審・副審・線審・得点）：'+esc(m.ref==null?m.pref:name(m.ref))+'　'+(v?'保存済み：'+v[0]+' - '+v[1]:'未入力')+'</p><p class="note" id="entry-msg" role="status"></p>';
  }
  h+='<div class="actions"><button type="button" class="btn" id="prev"'+(cursor===0?' disabled':'')+'>◀ 前の試合</button><button type="button" class="btn" id="next"'+(cursor===n-1?' disabled':'')+'>次の試合 ▶</button></div>';
  if(ready) h+='<div class="actions"><button type="button" class="btn primary" id="save-score">保存して次へ</button>'+(v?'<button type="button" class="btn" id="clear-score">結果を消す</button>':'')+'</div>';
  h+='</div><div class="card"><h2>全試合の一覧</h2><ul class="elist">'+ms.map(function(x,i){var r=sc(x.key);
    return '<li><button type="button" data-jump="'+i+'" aria-current="'+(i===cursor)+'"><span class="lb">'+hm(x.time)+' '+x.court+'</span><span class="vs">'+esc(x.stage)+'：'+esc(x.a==null?x.pa:name(x.a))+' 対 '+esc(x.b==null?x.pb:name(x.b))+'</span><span class="st'+(r?' done':'')+'">'+(r?r[0]+'-'+r[1]:'未入力')+'</span></button></li>'}).join('')+'</ul></div>';
  return h;
}
function viewFees(){
  var paid=state.teams.filter(function(t,i){return state.fees[i]}).length;
  var h='<div class="card"><div class="sum"><span>参加費 1チーム '+FEE.toLocaleString()+'円</span><span>徴収済み '+paid+' / '+state.teams.length+' チーム（'+(paid*FEE).toLocaleString()+'円）</span></div><div>';
  state.teams.forEach(function(t,i){var f=state.fees[i];
    h+='<div class="fee"><div><div class="tn">'+esc(t)+'</div><div class="when'+(f?'':' no')+'">'+(f?'徴収済み（'+esc(fmt(f))+'）':'未徴収')+'</div></div>'+
      (f?'<button type="button" class="btn" data-fee="'+i+'" data-v="0">取り消す</button>':'<button type="button" class="btn okb" data-fee="'+i+'" data-v="1">徴収済みにする</button>')+'</div>';});
  return h+'</div><p class="note">参加費の状況は管理者だけが見られます。</p></div>';
}
function viewSettings(){
  var url=location.origin+location.pathname;
  var h='<div class="card"><h2>参加者用QRコード</h2><p class="note">このページのURLです。印刷して会場に貼ってください。</p><p class="note" style="word-break:break-all">'+esc(url)+'</p><div id="qr" class="qr"></div></div>';
  h+='<div class="card"><h2>チーム名</h2><p class="note">番号の順番は対戦表と同じです。</p>';
  state.teams.forEach(function(t,i){h+='<div class="field"><label for="team-'+i+'">チーム'+(i+1)+'</label><input type="text" id="team-'+i+'" value="'+esc(t)+'"></div>'});
  return h+'<div class="actions"><button class="btn primary" id="save-settings" type="button">保存する</button></div></div>';
}

var PUB_TABS=[['sched','対戦表'],['league','順位'],['tour','トーナメント'],['info','要項']];
var SV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
var ICONS={
  sched:SV+'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M12 9v12"/></svg>',
  league:SV+'<path d="M8 21V11H3v10h5zM15 21V4H9v17h6zM21 21v-7h-5v7h5z"/></svg>',
  tour:SV+'<path d="M3 4h5v6h5M3 20h5v-6h5M13 7v10M13 12h8"/></svg>',
  info:SV+'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h6"/></svg>',
  entry:SV+'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  fees:SV+'<circle cx="12" cy="12" r="9"/><path d="M8 7l4 5 4-5M12 12v6M9 13h6M9 16h6"/></svg>',
  settings:SV+'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'
};
var ADM_TABS=[['entry','入力'],['fees','参加費'],['sched','対戦表'],['league','順位'],['tour','トーナメント'],['settings','設定']];
function render(){
  var C=compute(), admin=isAdmin();
  var tabs=admin?ADM_TABS:PUB_TABS;
  if(tab!=='login'&&!tabs.some(function(t){return t[0]===tab})) tab=tabs[0][0];
  if(tab==='login'&&admin) tab='entry';
  var view=tab==='sched'?viewSched(C):tab==='league'?viewLeague(C):tab==='tour'?viewTour(C):tab==='info'?viewInfo():
           tab==='login'?viewLogin():tab==='entry'?viewEntry(C):tab==='fees'?viewFees():viewSettings();
  if(loadError) view='<div class="alert">'+esc(loadError)+'</div>'+view;
  else if(!loaded) view='<p class="note">最新の結果を読み込んでいます…</p>'+view;
  var meta='<span class="live'+(online?' on':'')+'" aria-hidden="true"></span>'+(online?'LIVE 自動更新中':'10/31(土) 富岡小学校');
  // 入力中のフォーカスと値を守る
  var ae=document.activeElement, keep=ae&&ae.id&&ae.tagName==='INPUT'?{id:ae.id,v:ae.value,s:ae.selectionStart}:null;
  document.getElementById('app').innerHTML=
    '<header class="top"><div class="wrap"><div class="brand"><div><h1>第8回JK杯</h1><div class="sub">2026年10月31日（土）・山県市立 富岡小学校</div></div><span class="meta">'+meta+'</span></div></div></header>'+
    (admin?'<div class="adminbar"><div class="wrap"><span>管理者ページ</span><button type="button" id="logout">ログアウト</button></div></div>':'')+
    '<main><div class="wrap">'+view+'</div></main>'+
    (admin||tab==='login'?'':'<footer><div class="wrap"><button type="button" class="linkbtn" data-tab="login">管理者ログイン</button></div></footer>')+
    '<nav class="bottomnav" aria-label="ページ切り替え"><div class="in">'+tabs.map(function(t){return '<button type="button" data-tab="'+t[0]+'"'+(tab===t[0]?' aria-current="page"':'')+'>'+(ICONS[t[0]]||'')+'<span>'+t[1]+'</span></button>'}).join('')+'</div></nav>';
  if(keep){var el=document.getElementById(keep.id);if(el){el.value=keep.v;el.focus();try{el.setSelectionRange(keep.s,keep.s)}catch(e){}}}
  if(tab==='settings') drawQR();
}
function drawQR(){var el=document.getElementById('qr');if(!el||typeof QRCode==='undefined')return;el.innerHTML='';try{new QRCode(el,{text:location.origin+location.pathname,width:200,height:200,colorDark:'#0B0B1F',colorLight:'#ffffff'})}catch(e){}}
function toast(msg){var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2800)}

/* ---------- Supabase ---------- */
function loadAll(){
  if(!sb) return Promise.resolve();
  var q=[sb.from('jk8_results').select('key,a,b'), sb.from('jk8_settings').select('teams').eq('id',1).maybeSingle()];
  if(isAdmin()) q.push(rpc('jk8_get_fees',{}));
  return Promise.all(q).then(function(r){
    if(r[0].error) throw r[0].error;
    var scores={}; (r[0].data||[]).forEach(function(x){scores[x.key]=[x.a,x.b]});
    state.scores=scores;
    if(r[1].data&&Array.isArray(r[1].data.teams)) state.teams=r[1].data.teams;
    if(r[2]&&!r[2].error){var f={};(r[2].data||[]).forEach(function(x){f[x.team]=x.paid_at});state.fees=f;}
    loaded=true; loadError=''; render();
  }).catch(function(e){ loadError='結果を読み込めませんでした。電波の良い場所でページを開き直してください。'; render(); console.error(e); });
}
var channel=null, reloadTimer=null;
function scheduleReload(){ clearTimeout(reloadTimer); reloadTimer=setTimeout(loadAll,250); }
function subscribe(){
  if(!sb) return;
  if(channel) sb.removeChannel(channel);
  channel=sb.channel('jk8-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'jk8_results'},scheduleReload)
    .on('postgres_changes',{event:'*',schema:'public',table:'jk8_settings'},scheduleReload)
    .subscribe(function(status){ online=status==='SUBSCRIBED'; render(); });
}
function writeErr(e){
  console.error(e);
  var msg=(e&&e.message)||'';
  if(/not allowed/i.test(msg)) toast('保存できませんでした。ログインし直してください');
  else toast('保存できませんでした。電波を確認してもう一度押してください');
}
function saveScore(key,a,b,label){
  return rpc('jk8_save_result',{p_key:key,p_a:a,p_b:b}).then(function(r){
    if(r.error) throw r.error; state.scores[key]=[a,b]; render(); toast(label+' を保存しました');
  }).catch(writeErr);
}
function clearScore(key,label){
  return rpc('jk8_delete_result',{p_key:key}).then(function(r){
    if(r.error) throw r.error; delete state.scores[key]; render(); toast(label+' の結果を消しました');
  }).catch(writeErr);
}
function setFee(i,paid){
  var p=rpc('jk8_set_fee',{p_team:i,p_paid:paid});
  return p.then(function(r){ if(r.error) throw r.error; if(paid) state.fees[i]=new Date().toISOString(); else delete state.fees[i]; render(); toast(name(i)+(paid?' を徴収済みにしました':' の徴収を取り消しました')); }).catch(writeErr);
}
function saveTeams(teams){
  return rpc('jk8_save_teams',{p_teams:teams}).then(function(r){ if(r.error) throw r.error; state.teams=teams; render(); toast('チーム名を保存しました'); }).catch(writeErr);
}

/* ---------- 操作 ---------- */
document.addEventListener('submit',function(e){
  if(e.target.id!=='login-form') return; e.preventDefault();
  var id=document.getElementById('login-id').value.trim(), pw=document.getElementById('login-pw').value, msg=document.getElementById('login-msg');
  if(!sb){msg.textContent='接続の設定がまだです。';msg.style.color='var(--warn)';return;}
  document.getElementById('login-btn').disabled=true;
  sb.rpc('jk8_login',{p_id:id,p_pw:pw}).then(function(r){
    if(r.error||r.data!==true){ msg.textContent=r.error?'通信できませんでした。電波を確認してもう一度押してください。':'ログインIDかパスワードが違います。'; msg.style.color='var(--warn)'; document.getElementById('login-btn').disabled=false; return; }
    cred={id:id,pw:pw}; ls('jk8-cred',JSON.stringify(cred)); tab='entry'; ss('jk-tab',tab); loadAll(); toast('ログインしました');
  });
});
document.addEventListener('input',function(e){
  if(e.target.id==='score-0'||e.target.id==='score-1'){
    var m=matches(compute())[cursor];
    ss('jk-draft',JSON.stringify({key:m.key,a:document.getElementById('score-0').value,b:document.getElementById('score-1').value}));
  }
});
var busy=false;
function once(p){ if(busy) return; busy=true; Promise.resolve(p).then(function(){busy=false},function(){busy=false}); }
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab]'); if(t){tab=t.dataset.tab;ss('jk-tab',tab);render();window.scrollTo(0,0);return;}
  var f=e.target.closest('[data-filter]'); if(f){filter=+f.dataset.filter;ls('jk-filter',String(filter));render();return;}
  var j=e.target.closest('[data-jump]'); if(j){cursor=+j.dataset.jump;ss('jk-cursor',String(cursor));render();var en=document.getElementById('entry');if(en)en.scrollIntoView({block:'start'});return;}
  var st=e.target.closest('[data-step]'); if(st){var inp=document.getElementById('score-'+st.dataset.step);var n=(parseInt(inp.value,10)||0)+(+st.dataset.d);inp.value=Math.max(0,Math.min(99,n));inp.dispatchEvent(new Event('input',{bubbles:true}));return;}
  var fe=e.target.closest('[data-fee]'); if(fe){once(setFee(+fe.dataset.fee,fe.dataset.v==='1'));return;}
  var id=e.target.id;
  if(id==='prev'||id==='next'){cursor+=id==='prev'?-1:1;ss('jk-cursor',String(cursor));render();return;}
  if(id==='save-score'||id==='clear-score'){
    var C=compute(), ms=matches(C), m=ms[cursor], label=m.stage+' '+m.court+'コート';
    if(id==='clear-score'){ ss('jk-draft',null); once(clearScore(m.key,label)); return; }
    var a=parseInt(document.getElementById('score-0').value,10), b=parseInt(document.getElementById('score-1').value,10), msg=document.getElementById('entry-msg');
    if(isNaN(a)||isNaN(b)){msg.textContent='両チームの点数を入れてください。';msg.style.color='var(--warn)';return;}
    if(a===b){msg.textContent='同点は保存できません。点数を確認してください。';msg.style.color='var(--warn)';return;}
    ss('jk-draft',null);
    var nextCursor=Math.min(cursor+1,ms.length-1);
    once(saveScore(m.key,a,b,label+' '+name(m.a)+' '+a+' - '+b+' '+name(m.b)).then(function(){cursor=nextCursor;ss('jk-cursor',String(cursor));render();}));
    return;
  }
  if(id==='save-settings'){
    var teams=state.teams.map(function(old,i){var v=(document.getElementById('team-'+i).value||'').trim();return v||old});
    once(saveTeams(teams)); return;
  }
  if(id==='logout'){ cred=null; ls('jk8-cred',null); state.fees={}; tab='sched'; ss('jk-tab',tab); render(); toast('ログアウトしました'); }
});

/* ---------- 起動 ---------- */
render();
if(!CFG.SUPABASE_URL||!CFG.SUPABASE_ANON_KEY||!window.supabase){
  loadError=!window.supabase?'部品を読み込めませんでした。ページを開き直してください。':'Supabaseの接続先がまだ設定されていません（index.html の JK_CONFIG）。';
  render();
}else{
  sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:false}});
  loadAll(); subscribe();
  // 画面に戻ってきたとき・念のため30秒ごとに最新化
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) loadAll(); });
  setInterval(function(){ if(!document.hidden) loadAll(); },30000);
}
})();
</script>
</body>
</html>
